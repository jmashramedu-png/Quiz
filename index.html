<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz - MCQ Practice</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f6fc;
      color: #172554;
    }

    header {
      background: #ffffff;
      padding: 20px 8%;
      border-bottom: 1px solid #dbe4f0;
      font-size: 24px;
      font-weight: bold;
    }

    .container {
      max-width: 760px;
      margin: 50px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 32px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
    }

    .badge {
      display: inline-block;
      background: #dbeafe;
      color: #1d4ed8;
      padding: 8px 12px;
      border-radius: 20px;
      font-size: 13px;
    }

    h1 {
      font-size: 28px;
      margin-bottom: 10px;
    }

    .description {
      color: #64748b;
      line-height: 1.6;
    }

    .question {
      margin-top: 28px;
      font-size: 20px;
      line-height: 1.5;
      font-weight: bold;
    }

    .option {
      display: block;
      padding: 15px;
      margin: 12px 0;
      border: 1px solid #dbe4f0;
      border-radius: 10px;
      cursor: pointer;
      transition: 0.2s;
    }

    .option:hover {
      background: #eff6ff;
      border-color: #2563eb;
    }

    .option.selected {
      background: #dbeafe;
      border-color: #2563eb;
    }

    .option input {
      margin-right: 10px;
    }

    .button-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 28px;
    }

    button {
      border: none;
      padding: 13px 22px;
      border-radius: 9px;
      font-size: 15px;
      cursor: pointer;
    }

    .primary {
      background: #2563eb;
      color: white;
    }

    .primary:hover {
      background: #1d4ed8;
    }

    .secondary {
      background: #e2e8f0;
      color: #172554;
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .progress {
      height: 7px;
      background: #e2e8f0;
      border-radius: 10px;
      margin-top: 22px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: #2563eb;
      transition: width 0.3s;
    }

    .result {
      margin-top: 25px;
      padding: 20px;
      background: #f0fdf4;
      border-radius: 12px;
      line-height: 1.8;
    }

    footer {
      text-align: center;
      color: #64748b;
      font-size: 13px;
      padding: 20px;
    }

    @media (max-width: 600px) {
      .container {
        margin: 20px auto;
        padding: 12px;
      }

      .card {
        padding: 22px;
      }

      header {
        padding: 18px 20px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

<header>🎓 Quiz</header>

<main class="container">
  <section class="card">
    <span class="badge">MCQ PRACTICE</span>

    <h1 id="topicTitle">Business Environment</h1>

    <p class="description">
      Test your knowledge with this practice quiz.
      Select the correct answer for each question.
    </p>

    <div id="quizArea">
      <div id="questionNumber"></div>

      <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <div class="question" id="questionText"></div>

      <div id="options"></div>

      <div class="button-row">
        <button class="secondary" id="previousBtn"
          onclick="previousQuestion()">Previous</button>

        <button class="primary" id="nextBtn"
          onclick="nextQuestion()">Next</button>
      </div>
    </div>

    <div id="resultArea" hidden></div>
  </section>
</main>

<footer>Quiz — Learn. Practice. Excel.</footer>

<script>
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQRpjPX414vA7qEnqGWv1c5zCCTDdyuo1J3BSzykIQfsHoHYmiJoYCzvfAQ7-elRuaf594fVs4ZWKfe/pub?gid=1572833681&single=true&output=csv";

  const questionBanks = {
    "business-environment": {
      title: "Business Environment",
      questions: []
    }
  };

  const params = new URLSearchParams(window.location.search);
  const requestedTopic = params.get("topic") || "business-environment";
  let quiz = questionBanks[requestedTopic];

  let currentQuestion = 0;
  let answers = [];
  let submitted = false;

  const topicTitle = document.getElementById("topicTitle");
  const questionNumber = document.getElementById("questionNumber");
  const questionText = document.getElementById("questionText");
  const optionsContainer = document.getElementById("options");
  const progressBar = document.getElementById("progressBar");
  const previousBtn = document.getElementById("previousBtn");
  const nextBtn = document.getElementById("nextBtn");
  const quizArea = document.getElementById("quizArea");
  const resultArea = document.getElementById("resultArea");

  function showUnavailable() {
    topicTitle.textContent = "Topic unavailable";
    document.querySelector(".description").textContent =
      "This topic is not available yet. Please return to the topic list.";
    quizArea.hidden = true;
  }

  function renderQuestion() {
    const q = quiz.questions[currentQuestion];

    topicTitle.textContent = quiz.title;
    questionNumber.textContent =
      `Question ${currentQuestion + 1} of ${quiz.questions.length}`;

    questionText.textContent = q.question;
    optionsContainer.innerHTML = "";

    q.options.forEach((option, index) => {
      const label = document.createElement("label");
      label.className = "option";

      if (answers[currentQuestion] === index) {
        label.classList.add("selected");
      }

      const input = document.createElement("input");
      input.type = "radio";
      input.name = "answer";
      input.value = index;
      input.checked = answers[currentQuestion] === index;

      input.addEventListener("change", () => {
        answers[currentQuestion] = index;
        renderQuestion();
      });

      label.appendChild(input);
      label.appendChild(document.createTextNode(option));
      optionsContainer.appendChild(label);
    });

    previousBtn.disabled = currentQuestion === 0;
    nextBtn.textContent =
      currentQuestion === quiz.questions.length - 1
        ? "Submit Quiz"
        : "Next";

    progressBar.style.width =
      `${((currentQuestion + 1) / quiz.questions.length) * 100}%`;
  }

  function previousQuestion() {
    if (submitted || currentQuestion === 0) return;

    currentQuestion--;
    renderQuestion();
  }

  function nextQuestion() {
    if (submitted) return;

    if (answers[currentQuestion] === undefined) {
      alert("Please select an answer before continuing.");
      return;
    }

    if (currentQuestion < quiz.questions.length - 1) {
      currentQuestion++;
      renderQuestion();
    } else {
      submitQuiz();
    }
  }

  function submitQuiz() {
    submitted = true;

    const score = quiz.questions.reduce((total, q, index) => {
      return total + (answers[index] === q.answer ? 1 : 0);
    }, 0);

    quizArea.hidden = true;
    resultArea.hidden = false;
    resultArea.className = "result";

    const heading = document.createElement("h2");
    heading.textContent = "Quiz Completed!";

    const scoreText = document.createElement("p");
    scoreText.textContent =
      `Your score: ${score} out of ${quiz.questions.length}`;

    const retryBtn = document.createElement("button");
    retryBtn.className = "primary";
    retryBtn.textContent = "Restart Quiz";
    retryBtn.onclick = () => window.location.reload();

    resultArea.replaceChildren(heading, scoreText, retryBtn);
  }

  function parseCSV(text) {
    const rows = [];
    let row = [];
    let cell = "";
    let insideQuotes = false;

    for (let i = 0; i < text.length; i++) {
      const char = text[i];
      const next = text[i + 1];

      if (char === '"') {
        if (insideQuotes && next === '"') {
          cell += '"';
          i++;
        } else {
          insideQuotes = !insideQuotes;
        }
      } else if (char === "," && !insideQuotes) {
        row.push(cell.trim());
        cell = "";
      } else if ((char === "\n" || char === "\r") && !insideQuotes) {
        if (char === "\r" && next === "\n") i++;
        row.push(cell.trim());
        if (row.some(value => value !== "")) rows.push(row);
        row = [];
        cell = "";
      } else {
        cell += char;
      }
    }

    if (cell.length > 0 || row.length > 0) {
      row.push(cell.trim());
      if (row.some(value => value !== "")) rows.push(row);
    }
    return rows;
  }

  async function loadQuestionsFromSheet() {
    try {
      if (!quiz) {
        showUnavailable();
        return;
      }

      topicTitle.textContent = "Loading questions…";
      questionText.textContent = "Connecting to Google Sheets…";

      const response = await fetch(CSV_URL, { cache: "no-store" });
      if (!response.ok) throw new Error("Google Sheets returned HTTP " + response.status);

      const csvText = await response.text();
      const rows = parseCSV(csvText);
      if (rows.length < 2) throw new Error("The sheet appears to contain no question rows.");

      const headers = rows[0].map(h => h.trim().toLowerCase().replace(/[^a-z0-9]/g, ""));
      const findColumn = (...names) => headers.findIndex(h => names.includes(h));
      const qCol = findColumn("question", "questions");
      const aCol = findColumn("optiona", "option1", "a");
      const bCol = findColumn("optionb", "option2", "b");
      const cCol = findColumn("optionc", "option3", "c");
      const dCol = findColumn("optiond", "option4", "d");
      const answerCol = findColumn("correctanswer", "correctoption", "answer", "correct");

      if ([qCol, aCol, bCol, cCol, dCol, answerCol].includes(-1)) {
        throw new Error("Column headings must be Question, Option A, Option B, Option C, Option D, Correct Answer.");
      }

      const questions = rows.slice(1).map(row => {
        const answerText = (row[answerCol] || "").trim().toUpperCase();
        const answerMatch = answerText.match(/^[ABCD]/);
        const answer = answerMatch ? "ABCD".indexOf(answerMatch[0]) : Number(answerText) - 1;
        return {
          question: (row[qCol] || "").trim(),
          options: [aCol, bCol, cCol, dCol].map(i => (row[i] || "").trim()),
          answer
        };
      }).filter(q => q.question && q.options.every(Boolean) && Number.isInteger(q.answer) && q.answer >= 0 && q.answer <= 3);

      if (!questions.length) throw new Error("No valid MCQs found. Check the question rows and correct answers (A, B, C, or D).");

      quiz.questions = questions;
      currentQuestion = 0;
      answers = [];
      submitted = false;
      renderQuestion();
    } catch (error) {
      console.error("Quiz loading error:", error);
      topicTitle.textContent = "Could not load quiz";
      document.querySelector(".description").textContent = error.message + " Make sure the spreadsheet is published as CSV and the column headings are correct.";
      quizArea.hidden = true;
    }
  }

  loadQuestionsFromSheet();
</script>

</body>
</html>
